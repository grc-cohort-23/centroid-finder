name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  java-tests:
    name: Java processor tests (Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # -B = batch mode (no color, no interactive prompts — cleaner CI output)
      - name: Run mvn test
        run: mvn -B test
        working-directory: processor

  node-tests:
    name: Node server tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run npm test
        run: npm test
        working-directory: server

name: JUnit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          # Reuse downloaded Maven dependencies (JavaCV is large) between runs.
          cache: 'maven'

      # Maven compiles src/main/java and src/test/java, downloads JavaCV,
      # and runs every JUnit test. It fails the job if any test fails.
      - name: Compile and run tests
        run: mvn -B test

      - name: Verify test count
        run: |
          # Add up "Tests run: N" from each test class's report.
          TEST_COUNT=$(awk -F'[:,]' '/^Tests run:/ { sum += $2 } END { print sum + 0 }' target/surefire-reports/*.txt)
          MIN_TESTS=15

          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "❌ Only $TEST_COUNT tests were run. At least $MIN_TESTS tests are required. Please write more unit tests"
            exit 1
          fi

          echo "✅ All unit tests passed and $TEST_COUNT tests were executed."
